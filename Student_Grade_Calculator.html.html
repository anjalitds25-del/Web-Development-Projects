<!DOCTYPE html>
<html>
<head>
<title>Student Grade Calculator</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:30px}
.container{max-width:600px;margin:auto;background:white;padding:25px;border-radius:12px}
input{width:100%;padding:10px;margin:8px 0 15px;box-sizing:border-box}
button{padding:12px 20px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}
#result{background:#eef4ff;padding:15px;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<h1>Student Grade Calculator</h1>
<label>Subject 1:</label><input type="number" id="m1" min="0" max="100">
<label>Subject 2:</label><input type="number" id="m2" min="0" max="100">
<label>Subject 3:</label><input type="number" id="m3" min="0" max="100">
<label>Subject 4:</label><input type="number" id="m4" min="0" max="100">
<label>Subject 5:</label><input type="number" id="m5" min="0" max="100">
<button id="calculate">Calculate Grade</button>
<h2 id="result"></h2>
</div>
<script>
document.getElementById("calculate").addEventListener("click", function(){
let m1=Number(document.getElementById("m1").value);
let m2=Number(document.getElementById("m2").value);
let m3=Number(document.getElementById("m3").value);
let m4=Number(document.getElementById("m4").value);
let m5=Number(document.getElementById("m5").value);
let marks=[m1,m2,m3,m4,m5];
if(marks.some(m=>m<0||m>100)){document.getElementById("result").innerHTML="Please enter marks between 0 and 100.";return;}
let total=m1+m2+m3+m4+m5;
let percentage=(total/500)*100;
let grade;
if(percentage>=90) grade="A+";
else if(percentage>=80) grade="A";
else if(percentage>=70) grade="B";
else if(percentage>=60) grade="C";
else if(percentage>=50) grade="D";
else grade="F";
document.getElementById("result").innerHTML="Total Marks: "+total+"/500<br>Percentage: "+percentage.toFixed(2)+"%<br>Grade: "+grade;
});
</script>
</body>
</html>
