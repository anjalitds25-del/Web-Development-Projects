<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4ff}
.container{width:400px;max-width:90%;margin:50px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 0 15px #bbb}
h2{text-align:center;color:#18255c}
label{font-weight:bold;color:#18255c}
input{width:100%;padding:11px;margin:7px 0 15px;border:1px solid #b8c8ee;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:#3478e5;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer}
#message{text-align:center;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h2>Student Registration</h2>
<form id="registrationForm">
<label>Name:</label>
<input type="text" id="name" placeholder="Enter your name">
<label>Email:</label>
<input type="text" id="email" placeholder="Enter your email">
<label>Password:</label>
<input type="password" id="password" placeholder="Enter password">
<label>Mobile Number:</label>
<input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
<button type="submit">Register</button>
</form>
<p id="message"></p>
</div>
<script>
document.getElementById("registrationForm").addEventListener("submit",function(event){
event.preventDefault();
let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;
let mobile=document.getElementById("mobile").value.trim();
let message=document.getElementById("message");
if(name===""||email===""||password===""||mobile===""){
message.innerHTML="Please fill all mandatory fields."; message.style.color="red"; return;
}
let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
if(!emailPattern.test(email)){
message.innerHTML="Please enter a valid email address."; message.style.color="red"; return;
}
if(password.length<6){
message.innerHTML="Password must be at least 6 characters."; message.style.color="red"; return;
}
let mobilePattern=/^[0-9]{10}$/;
if(!mobilePattern.test(mobile)){
message.innerHTML="Mobile number must contain 10 digits."; message.style.color="red"; return;
}
message.innerHTML="Registration Successful!"; message.style.color="green";
});
</script>
</body>
</html>
